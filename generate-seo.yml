name: Generate SEO pages

on:
  schedule:
    - cron: '30 21 * * *'   # roz raat ~3:00 AM IST (21:30 UTC)
  workflow_dispatch: {}       # Actions tab -> "Run workflow" se turant bhi chala sakte ho

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate category + product pages, sitemap, merchant feed
        run: node scripts/generate-seo.mjs

      - name: Commit changes (if any)
        run: |
          git config user.name "jagashilp-seo-bot"
          git config user.email "actions@github.com"
          git add product category sitemap.xml google-merchant-feed.xml index.html
          git diff --staged --quiet || git commit -m "chore: regenerate SEO pages, sitemap and merchant feed"
          git push
